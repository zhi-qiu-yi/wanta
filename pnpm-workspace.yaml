# pnpm 10+ blocks dependency install/postinstall scripts by default. This list
# allows the dependencies that actually ran build scripts under pnpm 9 (sqlite3
# is a native module required for packaging; the rest keep behavior unchanged).
allowBuilds:
  electron-winstaller: true
  msgpackr-extract: true
  opencode-ai: true
  protobufjs: true
  sqlite3: true

# The Claude ACP bridge pulls the native Claude Code CLI as a platform-specific
# optional package. Wanta never uses that bundled runtime: the bridge receives
# the user's own CLI through CLAUDE_CODE_EXECUTABLE. Skip these downloads so
# the dev tree stays free of bundled agent binaries.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64"
  - "@anthropic-ai/claude-agent-sdk-win32-x64"
